<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnackOverflow | Management</title>
    <script src="/management.js" defer></script>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <header>
      <h1>SnackOverflow</h1>
      <p>Management front end</p>
      <p><a href="/">Return to restaurant front end</a></p>
    </header>

    <main>
      <section aria-labelledby="login-heading">
        <h2 id="login-heading">Owner / Admin Login</h2>

        <p id="login-status" role="status" aria-live="polite">
          Please log in to manage restaurants and menus.
        </p>

        <form id="management-login-form">
          <p>
            <label for="login-email">Email:</label>
            <input
              id="login-email"
              name="email"
              type="email"
              required
            />
          </p>

          <p>
            <label for="login-password">Password:</label>
            <input
              id="login-password"
              name="password"
              type="password"
              required
            />
          </p>

          <button type="submit">Log in</button>

          <button id="management-logout" type="button" hidden>
            Log out
          </button>
        </form>
      </section>

      <section aria-labelledby="restaurant-management-heading">
        <h2 id="restaurant-management-heading">Restaurants</h2>

        <p id="restaurant-status" role="status" aria-live="polite">
          Loading restaurants...
        </p>

        <ul id="restaurant-list"></ul>

        <h3 id="restaurant-form-heading">Create a restaurant</h3>

        <form id="restaurant-form">
          <p>
            <label for="restaurant-select">
              Restaurant to edit (or choose create):
            </label>

            <select id="restaurant-select">
              <option value="">Create a new restaurant</option>
            </select>
          </p>

          <p>
            <label for="restaurant-name">Name:</label>
            <input id="restaurant-name" name="name" required />
          </p>

          <p>
            <label for="restaurant-cuisine">Cuisine:</label>
            <input id="restaurant-cuisine" name="cuisine" required />
          </p>

          <p>
            <label for="restaurant-address">Address:</label>
            <input id="restaurant-address" name="address" required />
          </p>

          <p>
            <label for="restaurant-rating">Rating (0-5):</label>
            <input
              id="restaurant-rating"
              name="rating"
              type="number"
              min="0"
              max="5"
              step="0.1"
              required
            />
          </p>

          <button id="restaurant-submit" type="submit">
            Create restaurant
          </button>
        </form>
      </section>

      <section
        id="menu-management"
        aria-labelledby="menu-management-heading"
        hidden
      >
        <h2 id="menu-management-heading">
          Menu for <span id="menu-restaurant-name"></span>
        </h2>

        <p id="menu-status" role="status" aria-live="polite"></p>

        <ul id="menu-list"></ul>

        <h3 id="menu-form-heading">Add a menu item</h3>

        <form id="menu-form">
          <p>
            <label for="menu-item-name">Item name:</label>
            <input id="menu-item-name" name="name" required />
          </p>

          <p>
            <label for="menu-item-price">Price:</label>
            <input
              id="menu-item-price"
              name="price"
              type="number"
              min="0.01"
              step="0.01"
              required
            />
          </p>

          <p>
            <label for="menu-item-available">
              <input
                id="menu-item-available"
                name="available"
                type="checkbox"
                checked
              />
              Available to order
            </label>
          </p>

          <p>
            <label for="menu-item-active">
              <input
                id="menu-item-active"
                name="active"
                type="checkbox"
                checked
              />
              Active menu item
            </label>
          </p>

          <button id="menu-submit" type="submit">
            Add menu item
          </button>

          <button id="menu-cancel-edit" type="button" hidden>
            Cancel edit
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
