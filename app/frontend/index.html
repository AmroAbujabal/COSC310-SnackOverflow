<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnackOverflow</title>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>SnackOverflow</h1>
      <p>Find a restaurant and view its menu.</p>
      <p><a href="/management">Management front end</a></p>
    </header>

    <main>
      <section aria-labelledby="restaurants-heading">
        <h2 id="restaurants-heading">Restaurants <span id="result-count"></span></h2>
        <p>
          <label for="search-input">Search by name, cuisine, address, or rating:</label>
          <input id="search-input" type="search" placeholder="Enter restaurant information" autocomplete="off" />
        </p>
        <p id="status" role="status" aria-live="polite">Loading restaurants...</p>
        <ul id="restaurant-grid"></ul>
        <section id="menu-panel" hidden aria-live="polite"></section>
      </section>
    </main>
  </body>
</html>
